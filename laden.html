<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leseflitz laden</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<!-- Ziel des QR-Codes auf der Startseite und Link für alle Kanäle (laden.html?k=bekannte usw., Liste in stores.js):
     leitet iPhone/iPad in den App Store und Android zu Google Play weiter, mit Kürzel (ohne ?k= „qr“). Am Computer und
     ohne JavaScript zeigt die Seite beide Knöpfe. -->
<body data-weiter="qr">
<div class="wrap">
  <header class="top">
    <a href="./" class="logo"><picture><source srcset="img/logo.webp" type="image/webp"><img src="img/logo-400.png" alt="Leseflitz" width="400" height="125"></picture></a>
  </header>
  <main>
  <section class="hero">
    <h1>Leseflitz laden</h1>
    <div class="stores" data-place="qr">
      <a data-os="ios" href="https://apps.apple.com/de/app/leseflitz/id6828036647?mt=8&amp;ct=qr"><img src="img/badge-appstore-de.svg" alt="Laden im App Store" width="120" height="40"></a>
      <a data-os="android" href="https://play.google.com/store/apps/details?id=de.leseflitz.app&amp;referrer=utm_source%3Dqr%26utm_medium%3Dlink%26utm_campaign%3Dstart"><img src="img/badge-googleplay-de.webp" alt="Jetzt bei Google Play" width="166" height="64"></a>
    </div>
    <p><a href="./">Mehr über Leseflitz</a></p>
  </section>
  </main>
</div>
<script src="stores.js"></script>
</body>
</html>
